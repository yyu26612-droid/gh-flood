name: gc
on:
  schedule:
    # 每小时的第 40 分钟清理一次（比攻击触发晚 40 分钟，避开任务刚启动时）
    - cron: '40 * * * *'
  workflow_dispatch:

jobs:
  purge:
    runs-on: ubuntu-latest
    steps:
      - name: delete completed runs
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          REPO="${GITHUB_REPOSITORY}"
          API="https://api.github.com/repos/${REPO}/actions/runs"
          echo "repo=$REPO"
          # 拉最近 100 条
          IDS=$(curl -s -H "Authorization: Bearer $GH_PAT" \
                   -H "Accept: application/vnd.github+json" \
                   "${API}?per_page=100" | \
                 python3 -c 'import sys,json;d=json.load(sys.stdin);print("\n".join(str(r["id"]) for r in d.get("workflow_runs",[]) if r["status"]=="completed"))' 2>/dev/null)
          if [ -z "$IDS" ]; then echo "nothing to purge"; exit 0; fi
          N=0
          for id in $IDS; do
            CODE=$(curl -s -o /dev/null -w "%{http_code}" -X DELETE \
                     -H "Authorization: Bearer $GH_PAT" \
                     -H "Accept: application/vnd.github+json" \
                     "${API}/${id}")
            echo "  delete $id -> $CODE"
            N=$((N+1))
          done
          echo "purged $N run(s)"
