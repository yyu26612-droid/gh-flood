name: ot
on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  t:
    runs-on: ubuntu-latest
    steps:
      - name: origin-reachability
        run: |
          UA="Mozilla/5.0 (iPhone; CPU iPhone OS 17_5 like Mac OS X) AppleWebKit/605.1.15 Mobile/15E148 MicroMessenger/8.0.49"
          echo "egress: $(curl -s --max-time 10 https://api.ipify.org)"
          echo "--- tcp ---"
          timeout 8 bash -c 'cat < /dev/null > /dev/tcp/114.215.211.148/80' && echo "tcp80 OK" || echo "tcp80 FAIL"
          echo "--- http ---"
          for i in 1 2 3; do
            curl -sS --max-time 15 -H "Host: m.ipadpos.cn" -H "User-Agent: $UA" \
              -H "appType: mini" -H "uniacid: 3" -H "module: yb_wm_v3" \
              -o /dev/null -w "origin try=$i code=%{http_code} time=%{time_total}s\n" \
              "http://114.215.211.148/channelApi/goods" || echo "  try=$i curl fail"
          done
          echo "--- body ---"
          curl -sS --max-time 15 -H "Host: m.ipadpos.cn" -H "User-Agent: $UA" \
            -H "appType: mini" -H "uniacid: 3" -H "module: yb_wm_v3" \
            "http://114.215.211.148/channelApi/goods" | head -c 200; echo
          echo "--- cdn for comparison ---"
          curl -sS -k --max-time 15 -H "User-Agent: $UA" -H "appType: mini" \
            -H "uniacid: 3" -H "module: yb_wm_v3" \
            -o /dev/null -w "cdn code=%{http_code} time=%{time_total}s\n" \
            "https://m.ipadpos.cn/channelApi/goods"
